appId: com.curesense.patient
---
# Registration screen shows a validation error when the user enters a weak password
# (fewer than 8 characters or missing a digit). The form should not submit and
# an error should be visible inline.
# Run with: maestro test .maestro/07_register_weak_password.yaml

- launchApp

# Navigate to registration
- tapOn: "Register"

# Confirm registration screen loaded
- assertVisible: "Create Account"

# Fill in all required fields, using a deliberately weak password
- tapOn:
    text: "Full Name"
- inputText: "Test User"

- tapOn:
    text: "Email"
- inputText: "weakpass@example.com"

# Enter a password that is too short (under 8 characters, no digit)
- tapOn: "Password"
- inputText: "abc"

# Attempt to submit
- tapOn: "Sign Up"

# The registration screen must remain visible — no navigation
- assertVisible: "Create Account"

# The error indicator or message must be shown (inline or via Alert)
# The screen renders API / validation errors below the form
- assertNotVisible: "Welcome Back"
