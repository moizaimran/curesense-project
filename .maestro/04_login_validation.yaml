appId: com.curesense.patient
# Sign-in form requires email, then password, before calling Firebase
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- tapOn: "Sign In,.*"
- assertVisible: ".*Email is required..*"
- tapOn: "you@example.com"
- inputText: "test@example.com"
- tapOn: ".*Enter your details to continue.*"
- tapOn: "Sign In,.*"
- assertVisible: ".*Password is required..*"
- takeScreenshot: 04_login_validation
