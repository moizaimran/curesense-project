appId: com.curesense.patient
# Forgot-password form checks the email before calling the server
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- tapOn: ".*Forgot password?.*"
- assertVisible: ".*Send Reset Code.*"
- tapOn: ".*Send Reset Code.*"
- assertVisible: ".*Email is required..*"
- tapOn: "you@example.com"
- inputText: "not-an-email"
- tapOn: ".*Send Reset Code.*"
- assertVisible: ".*Enter a valid email address..*"
- takeScreenshot: 03_forgot_password_validation
