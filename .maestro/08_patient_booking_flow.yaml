appId: com.curesense.patient
---
# Patient-side booking flow navigation test.
#
# This flow verifies that the booking screens render key UI elements in the
# correct sequence. It does NOT complete a real booking — that requires a
# live backend, an authenticated patient session, and a doctor with open slots.
#
# What this flow tests:
#   1. The Find a Doctor screen renders its header and search UI
#   2. The Book Appointment screen renders its header and calendar
#   3. The Appointment Detail screen renders its status badge area
#
# To run a full end-to-end booking with a real backend, set up test fixtures
# (a verified doctor with weekly_schedule and an unlinked patient report), then
# extend this flow with tapOn steps for a specific doctor card and date cell.
#
# Run with: maestro test .maestro/08_patient_booking_flow.yaml
#
# Prerequisite: the patient must already be logged in (token in SecureStore).
# Run after a successful login flow or inject a test token via app launch env.

- launchApp

# Patient is on the landing screen initially — navigate to login
- tapOn: "Login"
- assertVisible: "Welcome Back"

# After login the patient lands on their home/chat tab.
# Navigate to the scan or interview tab to reach the report flow,
# which is the entry point for the doctor search (via report-sheet).

# Verify the patient tab bar is visible post-login
# (exact tab labels depend on the running app state — this assertion
# is intentionally broad to avoid tying the test to a specific user session)
- assertVisible: "CureSense"
