appId: com.curesense.patient
# Firebase rejects an unknown account; the app shows an error and stays on sign-in
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- tapOn: "you@example.com"
- inputText: "wrong@example.com"
- tapOn: "Enter your password"
- inputText: "WrongPassword1!"
- tapOn: ".*Enter your details to continue.*"
- tapOn: "Sign In,.*"
- extendedWaitUntil:
    visible: ".*Invalid email or password..*"
    timeout: 15000
- assertVisible: ".*Enter your details to continue.*"
- takeScreenshot: 06_login_wrong_password
