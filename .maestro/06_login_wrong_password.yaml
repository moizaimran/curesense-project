appId: com.curesense.patient
---
# Login screen shows an error when the user submits a wrong password.
# The error appears inline because the API returns a 401 and the screen
# displays the server message without navigating away.
# Run with: maestro test .maestro/06_login_wrong_password.yaml
#
# Note: this flow tests the UI error-display path only.
# It requires the app to be connected to a real or mock backend that returns
# 401 for invalid credentials; without a backend the error will not appear.

- launchApp

# Navigate to login
- tapOn: "Login"

# Confirm login screen loaded
- assertVisible: "Welcome Back"
- assertVisible: "Sign In"

# Enter a valid-looking email but an incorrect password
- tapOn:
    text: "john@example.com"
- inputText: "wrong@example.com"
- tapOn: "Password"
- inputText: "wrongpassword"

- tapOn: "Sign In"

# The login screen must remain visible — no navigation away
- assertVisible: "Welcome Back"

# An inline error message should appear (exact text depends on server response;
# check for any visible error container — the screen renders server errors inline)
- assertNotVisible: "Home"
